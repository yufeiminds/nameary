name: Bug report
description: Report a reproducible problem
title: "[bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Do **not** include GitHub tokens or other secrets.
        For a security vulnerability, use SECURITY.md instead of a public issue.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: input
    id: command
    attributes:
      label: Command
      description: The exact command, with private names or tokens redacted.
      placeholder: nameary acme --format console
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `nameary version`.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, architecture, terminal, and Go version if building from source.
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output / logs
      description: Paste relevant output. Remove tokens and sensitive names.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues.
          required: true
        - label: I removed secrets and private data from this report.
          required: true
