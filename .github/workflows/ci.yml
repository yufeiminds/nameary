name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.10"
          cache: true
      - name: gofmt
        run: |
          files=$(gofmt -l .)
          if [ -n "$files" ]; then
            echo "gofmt needed:"
            echo "$files"
            exit 1
          fi
      - name: vet
        run: go vet ./...
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - name: test
        run: go test -race ./internal/...
      - name: e2e (mock registries)
        run: go test -count=1 ./e2e
      - name: Homebrew formula template
        run: |
          checksums=$(mktemp)
          for asset in darwin_amd64 darwin_arm64 linux_amd64 linux_arm64; do
            printf '%064d  nameary_0.0.0_%s.tar.gz\n' 0 "$asset" >> "$checksums"
          done
          python3 scripts/render-homebrew-formula.py \
            --version 0.0.0 \
            --checksums "$checksums" \
            --template packaging/homebrew/nameary.rb.tmpl \
            --output /tmp/nameary.rb
          grep -q 'class Nameary' /tmp/nameary.rb
          grep -q 'version "0.0.0"' /tmp/nameary.rb
          bash -n scripts/update-homebrew-tap.sh
      - name: build
        run: go build ./cmd/nameary
